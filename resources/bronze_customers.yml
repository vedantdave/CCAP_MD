resources:

  jobs:

    bronze_customer:

      name: ${bundle.target}-bronze-customers

      parameters:
        - name: catalog
          default: ${var.catalog}

        - name: source_volume
          default: ${var.source_volume}

      tasks:

        - task_key: ingest_customers

          notebook_task:
            notebook_path: ../02_bronze/01_create_customers.ipynb

          environment_key: default

      environments:

        - environment_key: default

          spec:
            environment_version: "5"
            dependencies:
              - "pyspark"