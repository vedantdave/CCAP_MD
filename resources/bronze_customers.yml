resources:
  jobs:
    bronze_customer:
      name: ${bundle.target}-bronze-customers
      tasks:
        - task_key: ingest_customer
          notebook_task:
            notebook_path: ../02_bronze/01_create_customers.ipynb
            base_parameters:
              catalog: "{var.catalog}"
              source_volume: "{var.source_volume}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - "pyspark"